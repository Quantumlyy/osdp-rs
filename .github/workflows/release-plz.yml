name: Release-plz

on:
  push:
    branches:
      - main

# Default permissions; per-job overrides below add `id-token: write` only
# where it's actually needed (the publish job).
permissions:
  contents: read

# A second push to main while a release run is in flight is fine to queue —
# we don't want to cancel partial publishes.
concurrency:
  group: release-plz-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Opens / updates a release PR. Doesn't touch crates.io, so it doesn't
  # need OIDC. Just needs to push branches + open PRs.
  release-plz-pr:
    name: Release-plz PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Run release-plz
        uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}

  # Publishes to crates.io once a release PR is merged. Uses crates.io
  # *trusted publishing* — the short-lived token is minted from the
  # workflow's OIDC identity, so no `CARGO_REGISTRY_TOKEN` secret needed.
  #
  # Setup on crates.io (one-time, done by a maintainer):
  #   crates.io → Owners settings → Trusted publishers → Add GitHub:
  #     - Repository owner: Quantumlyy
  #     - Repository name:  osdp-rs
  #     - Workflow filename: release-plz.yml
  #     - Environment:       release
  release-plz-release:
    name: Release-plz publish
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Authenticate to crates.io (trusted publishing)
        uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - name: Run release-plz
        uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
